<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Pulse Animation Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .circuit-line {
        stroke-dasharray: 8 16;
        animation: flowCircuit 20s linear infinite;
      }
      @keyframes flowCircuit {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -200; }
      }
      .node-pulse {
        animation: pulseEffect 3s ease-in-out infinite alternate;
      }
      @keyframes pulseEffect {
        0% { transform: scale(0.95); opacity: 0.35; }
        100% { transform: scale(1.08); opacity: 0.85; }
      }
      .float-badge {
        animation: floatAnim 4s ease-in-out infinite alternate;
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      .float-badge-delayed {
        animation: floatAnim 4.5s ease-in-out infinite alternate;
        animation-delay: -2s;
      }
      .shine-bar {
        animation: shimmer 6s infinite ease-in-out;
      }
      @keyframes shimmer {
        0%, 100% { opacity: 0.2; transform: translateX(-50px); }
        50% { opacity: 0.7; transform: translateX(50px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Animated Ambient Tech Grid / Circuit Network in Background -->
  <g opacity="0.3">
    <!-- Grid dots -->
    <circle cx="100" cy="60" r="1.5" fill="#4f46e5" />
    <circle cx="200" cy="60" r="1.5" fill="#4f46e5" />
    <circle cx="300" cy="60" r="1.5" fill="#4f46e5" />
    <circle cx="900" cy="60" r="1.5" fill="#4f46e5" />
    <circle cx="1000" cy="60" r="1.5" fill="#4f46e5" />
    <circle cx="1100" cy="60" r="1.5" fill="#4f46e5" />

    <circle cx="100" cy="180" r="1.5" fill="#4f46e5" />
    <circle cx="1100" cy="180" r="1.5" fill="#4f46e5" />

    <circle cx="100" cy="300" r="1.5" fill="#4f46e5" />
    <circle cx="200" cy="300" r="1.5" fill="#4f46e5" />
    <circle cx="900" cy="300" r="1.5" fill="#4f46e5" />
    <circle cx="1000" cy="300" r="1.5" fill="#4f46e5" />
    <circle cx="1100" cy="300" r="1.5" fill="#4f46e5" />

    <!-- Connecting Dynamic Flow Lines -->
    <path class="circuit-line" d="M 50 180 Q 200 90 380 180 T 750 120 T 1150 180" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <path class="circuit-line" d="M 80 280 Q 300 240 500 290 T 950 260 T 1120 280" fill="none" stroke="#06b6d4" stroke-width="1.2" style="animation-direction: reverse; animation-duration: 25s;" />
    <path class="circuit-line" d="M 60 70 Q 320 110 600 60 T 980 90 T 1140 70" fill="none" stroke="#a855f7" stroke-width="1.2" style="animation-duration: 18s;" />
  </g>

  <!-- Pulsing Glowing Nodes in Background (Far Behind Text) -->
  <g class="node-pulse" style="transform-origin: center;">
    <circle cx="180" cy="90" r="70" fill="#6366f1" opacity="0.12" filter="url(#glow)" />
    <circle cx="1020" cy="270" r="80" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
    <circle cx="1050" cy="90" r="65" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
    <circle cx="140" cy="270" r="60" fill="#ec4899" opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- Interactive Dynamic Floating Pills / Badges (Offset to sides/bottom, not blocking text) -->
  <g class="float-badge">
    <!-- Top-Right Accent Badge: Intelligent Routing -->
    <g transform="translate(930, 42)">
      <rect width="210" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <circle cx="24" cy="21" r="5" fill="#10b981" />
      <text x="38" y="26" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">SMART ROUTING ACTIVE</text>
    </g>
  </g>

  <g class="float-badge-delayed">
    <!-- Top-Left Accent Badge: Multi-Processor -->
    <g transform="translate(60, 42)">
      <rect width="180" height="42" rx="21" fill="url(#card-grad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1" />
      <circle cx="22" cy="21" r="5" fill="#6366f1" />
      <text x="36" y="26" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">MULTI-PROCESSOR</text>
    </g>
  </g>

  <!-- Main Foreground Content - Title & Subtitle Guaranteed Clear & High Contrast -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <!-- Over-heading Tag -->
    <text y="-25" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2.5" text-transform="uppercase">
      CURATED ECOSYSTEM &amp; ARCHITECTURE GUIDE
    </text>

    <!-- Main Title -->
    <text y="32" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      AWESOME PAYMENT GATEWAY
    </text>

    <!-- Gradient Underline Accent Bar -->
    <rect class="shine-bar" x="-180" y="52" width="360" height="4" rx="2" fill="url(#primary-glow)" />

    <!-- Subtitle -->
    <text y="88" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Top Payment Gateways, Self-Hosted Stacks, Switches &amp; Multi-Processor Orchestrators
    </text>
  </g>

  <!-- Bottom Interactive Metadata Badges (Centered) -->
  <g transform="translate(600, 292)" text-anchor="middle">
    <!-- Tag 1: Stripe & Adyen -->
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-18" width="170" height="34" rx="17" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text y="5" font-size="12" font-weight="500" fill="#cbd5e1">💳 Global Acquirers</text>
    </g>
    <!-- Tag 2: Hyperswitch Orchestration -->
    <g transform="translate(-110, 0)">
      <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
      <text y="5" font-size="12" font-weight="600" fill="#818cf8">⚡ Open Orchestration</text>
    </g>
    <!-- Tag 3: Crypto & Bitcoin Gateways -->
    <g transform="translate(110, 0)">
      <rect x="-95" y="-18" width="190" height="34" rx="17" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
      <text y="5" font-size="12" font-weight="600" fill="#fbbf24">₿ Self-Hosted Crypto</text>
    </g>
    <!-- Tag 4: PCI DSS & Security -->
    <g transform="translate(320, 0)">
      <rect x="-85" y="-18" width="170" height="34" rx="17" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text y="5" font-size="12" font-weight="500" fill="#34d399">🔒 PCI DSS Compliant</text>
    </g>
  </g>
</svg>
